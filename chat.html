<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DocChat — Ask Your Documents</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Source+Serif+4:ital,wght@0,400;0,500;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-void: #0b0e1a;
    --bg-panel: #12172a;
    --bg-panel-2: #171d34;
    --accent-amber: #d4a24c;
    --accent-amber-soft: rgba(212, 162, 76, 0.16);
    --accent-amber-dim: rgba(212, 162, 76, 0.4);
    --text-primary: #ece7d8;
    --text-muted: #8891a8;
    --text-faint: #545e78;
    --user-bubble: #2f3a5c;
    --card-border: rgba(212, 162, 76, 0.22);
    --error: #c86a5c;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg-void);
    font-family: 'Source Serif 4', Georgia, serif;
    color: var(--text-primary);
    overflow: hidden;
  }

  /* Ambient lamp-glow backdrop */
  body::before {
    content: "";
    position: fixed;
    top: -20%;
    left: 50%;
    transform: translateX(-50%);
    width: 900px;
    height: 700px;
    background: radial-gradient(circle, rgba(212,162,76,0.10) 0%, rgba(212,162,76,0.03) 40%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .app {
    position: relative;
    z-index: 1;
    max-width: 760px;
    margin: 0 auto;
    height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 0 20px;
  }

  header {
    padding: 32px 4px 20px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    border-bottom: 1px solid rgba(212,162,76,0.12);
  }

  .brand {
    display: flex;
    align-items: baseline;
    gap: 12px;
  }

  .brand-mark {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 26px;
    letter-spacing: -0.01em;
    color: var(--text-primary);
  }

  .brand-mark em {
    font-style: italic;
    color: var(--accent-amber);
  }

  .brand-sub {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-faint);
  }

  #doc-status {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-faint);
    text-align: right;
  }

  #doc-status.online { color: var(--accent-amber); }

  /* Chat scroll area */
  .chat-window {
    flex: 1;
    overflow-y: auto;
    padding: 28px 4px 20px;
    display: flex;
    flex-direction: column;
    gap: 22px;
    scroll-behavior: smooth;
  }

  .chat-window::-webkit-scrollbar { width: 6px; }
  .chat-window::-webkit-scrollbar-thumb { background: rgba(212,162,76,0.15); border-radius: 3px; }

  .empty-state {
    margin: auto;
    text-align: center;
    color: var(--text-faint);
    max-width: 380px;
  }

  .empty-state .lamp-icon {
    font-size: 28px;
    margin-bottom: 14px;
    opacity: 0.6;
  }

  .empty-state h2 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 19px;
    color: var(--text-muted);
    margin: 0 0 8px;
  }

  .empty-state p {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    line-height: 1.7;
    color: var(--text-faint);
  }

  /* Messages */
  .msg-row { display: flex; }
  .msg-row.user { justify-content: flex-end; }
  .msg-row.ai { justify-content: flex-start; }

  .bubble-user {
    background: var(--user-bubble);
    color: var(--text-primary);
    padding: 12px 18px;
    border-radius: 16px 16px 4px 16px;
    max-width: 78%;
    font-size: 15px;
    line-height: 1.55;
  }

  /* AI answer styled as an annotated index card */
  .card-ai {
    max-width: 86%;
    background: linear-gradient(180deg, var(--bg-panel-2), var(--bg-panel));
    border: 1px solid var(--card-border);
    border-radius: 4px 14px 14px 14px;
    padding: 18px 20px 14px;
    position: relative;
  }

  .card-ai::before {
    content: "";
    position: absolute;
    top: 0; left: 0;
    width: 26px; height: 26px;
    background: var(--bg-void);
    clip-path: polygon(0 0, 100% 0, 0 100%);
    border-radius: 4px 0 0 0;
  }

  .card-ai .answer-text {
    font-size: 15.5px;
    line-height: 1.7;
    color: var(--text-primary);
    white-space: pre-wrap;
  }

  .sources-row {
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px dashed rgba(212,162,76,0.2);
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
  }

  .source-stamp {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    color: var(--accent-amber);
    background: var(--accent-amber-soft);
    border: 1px solid var(--accent-amber-dim);
    border-radius: 3px;
    padding: 3px 8px;
    letter-spacing: 0.02em;
    white-space: nowrap;
  }

  /* Typing indicator */
  .typing-card {
    display: flex;
    gap: 5px;
    align-items: center;
    padding: 14px 20px;
  }
  .typing-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent-amber-dim);
    animation: pulse 1.2s infinite ease-in-out;
  }
  .typing-dot:nth-child(2) { animation-delay: 0.15s; }
  .typing-dot:nth-child(3) { animation-delay: 0.3s; }
  @keyframes pulse {
    0%, 60%, 100% { opacity: 0.3; transform: scale(0.85); }
    30% { opacity: 1; transform: scale(1); }
  }

  .error-card {
    color: var(--error);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
    border: 1px solid rgba(200,106,92,0.35);
    background: rgba(200,106,92,0.08);
    padding: 12px 16px;
    border-radius: 8px;
    max-width: 86%;
  }

  /* Input bar */
  .input-bar {
    padding: 16px 4px 26px;
  }

  .input-shell {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--bg-panel);
    border: 1px solid rgba(212,162,76,0.18);
    border-radius: 999px;
    padding: 6px 6px 6px 20px;
    transition: border-color 0.2s ease;
  }

  .input-shell:focus-within {
    border-color: var(--accent-amber-dim);
  }

  .input-shell input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text-primary);
    font-family: 'Source Serif 4', serif;
    font-size: 15px;
    padding: 10px 0;
  }

  .input-shell input::placeholder { color: var(--text-faint); }

  .send-btn {
    width: 38px; height: 38px;
    border-radius: 50%;
    border: none;
    background: var(--accent-amber);
    color: var(--bg-void);
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: transform 0.15s ease, background 0.15s ease;
  }

  .send-btn:hover { transform: scale(1.06); }
  .send-btn:disabled {
    background: var(--bg-panel-2);
    color: var(--text-faint);
    cursor: not-allowed;
    transform: none;
  }

  .hint {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text-faint);
    text-align: center;
    margin-top: 10px;
    letter-spacing: 0.03em;
  }

  @media (prefers-reduced-motion: reduce) {
    .typing-dot { animation: none; }
    .chat-window { scroll-behavior: auto; }
  }
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="brand">
      <span class="brand-mark">Doc<em>Chat</em></span>
    </div>
    <div id="doc-status">checking server…</div>
  </header>

  <div class="chat-window" id="chatWindow">
    <div class="empty-state" id="emptyState">
      <div class="lamp-icon">◐</div>
      <h2>Ask your documents anything</h2>
      <p>ANSWERS ARE GROUNDED IN YOUR PDFs<br>WITH PAGE-LEVEL CITATIONS BELOW EACH REPLY</p>
    </div>
  </div>

  <div class="input-bar">
    <div class="input-shell">
      <input
        type="text"
        id="questionInput"
        placeholder="What would you like to know?"
        autocomplete="off"
      />
      <button class="send-btn" id="sendBtn" aria-label="Send question">→</button>
    </div>
    <div class="hint">CONNECTS TO YOUR LOCAL FASTAPI SERVER AT :8000</div>
  </div>
</div>

<script>
  const API_URL = "http://127.0.0.1:8000";
  const chatWindow = document.getElementById("chatWindow");
  const emptyState = document.getElementById("emptyState");
  const input = document.getElementById("questionInput");
  const sendBtn = document.getElementById("sendBtn");
  const statusEl = document.getElementById("doc-status");

  async function checkHealth() {
    try {
      const res = await fetch(`${API_URL}/health`);
      if (res.ok) {
        statusEl.textContent = "● server online";
        statusEl.classList.add("online");
      } else {
        throw new Error();
      }
    } catch {
      statusEl.textContent = "○ server offline — start uvicorn";
      statusEl.classList.remove("online");
    }
  }
  checkHealth();
  setInterval(checkHealth, 8000);

  function scrollToBottom() {
    chatWindow.scrollTop = chatWindow.scrollHeight;
  }

  function addUserMessage(text) {
    if (emptyState) emptyState.remove();
    const row = document.createElement("div");
    row.className = "msg-row user";
    row.innerHTML = `<div class="bubble-user"></div>`;
    row.querySelector(".bubble-user").textContent = text;
    chatWindow.appendChild(row);
    scrollToBottom();
  }

  function addTypingIndicator() {
    const row = document.createElement("div");
    row.className = "msg-row ai";
    row.id = "typingRow";
    row.innerHTML = `
      <div class="card-ai typing-card">
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
      </div>`;
    chatWindow.appendChild(row);
    scrollToBottom();
  }

  function removeTypingIndicator() {
    const row = document.getElementById("typingRow");
    if (row) row.remove();
  }

  function addAIMessage(answer, sources) {
    const row = document.createElement("div");
    row.className = "msg-row ai";

    const sourcesHTML = sources && sources.length
      ? `<div class="sources-row">${sources.map(s => `<span class="source-stamp">${escapeHTML(s)}</span>`).join("")}</div>`
      : "";

    row.innerHTML = `
      <div class="card-ai">
        <div class="answer-text"></div>
        ${sourcesHTML}
      </div>`;
    row.querySelector(".answer-text").textContent = answer;
    chatWindow.appendChild(row);
    scrollToBottom();
  }

  function addErrorMessage(text) {
    const row = document.createElement("div");
    row.className = "msg-row ai";
    row.innerHTML = `<div class="error-card"></div>`;
    row.querySelector(".error-card").textContent = text;
    chatWindow.appendChild(row);
    scrollToBottom();
  }

  function escapeHTML(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  async function sendQuestion() {
    const question = input.value.trim();
    if (!question) return;

    addUserMessage(question);
    input.value = "";
    sendBtn.disabled = true;
    addTypingIndicator();

    try {
      const res = await fetch(`${API_URL}/chat`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question }),
      });

      removeTypingIndicator();

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        addErrorMessage(err.detail || `Server error (${res.status}). Is uvicorn running?`);
        return;
      }

      const data = await res.json();
      addAIMessage(data.answer, data.sources);
    } catch (e) {
      removeTypingIndicator();
      addErrorMessage(
        "Couldn't reach the server. Make sure 'uvicorn app:app --reload' is running in your docchat folder."
      );
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  }

  sendBtn.addEventListener("click", sendQuestion);
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") sendQuestion();
  });

  input.focus();
</script>

</body>
</html>
